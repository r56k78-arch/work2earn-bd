<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Work2Earn BD — Admin</title><link rel="stylesheet" href="admin.css"></head><body><main class="wrap"><section id="loginBox" class="card login"><div class="brand">Work2Earn BD</div><p class="muted">Admin Panel</p><form id="adminLogin"><label>Admin username</label><input id="adminUser" autocomplete="username" required><label>Admin password</label><input id="adminPass" type="password" autocomplete="current-password" required><button class="primary">Login</button></form><p id="loginMsg" class="msg"></p></section><section id="panel" hidden><header class="topbar"><div><b>Work2Earn BD</b><span class="muted"> Admin Panel</span></div><button id="logoutBtn" class="secondary">Logout</button></header><p id="status" class="msg"></p><nav class="nav"><button data-tab="overview">Dashboard</button><button data-tab="tasks">Tasks</button><button data-tab="proofs">Proofs</button><button data-tab="users">Users</button><button data-tab="withdrawals">Withdrawals</button><button data-tab="deposits">Deposits</button><button data-tab="settings">Settings</button></nav><section id="overview" class="view"><div class="stats"><div class="stat">Users<b id="sUsers">0</b></div><div class="stat">Active tasks<b id="sTasks">0</b></div><div class="stat">Pending proofs<b id="sProofs">0</b></div><div class="stat">Pending withdrawals<b id="sWithdrawals">0</b></div><div class="stat">Pending deposits<b id="sDeposits">0</b></div></div></section><section id="tasks" class="view" hidden><div class="card"><h2>Create Task</h2><form id="taskForm"><label>Task title</label><input id="taskTitle" required><label>Description / task instructions</label><textarea id="taskDesc" required></textarea><label>Reward per approved user (৳)</label><input id="taskReward" type="number" min="1" step="1" required><label>Maximum participants (minimum 2)</label><input id="taskMax" type="number" min="2" value="2" required><button class="primary">Create task</button></form></div><div class="card"><h2>All tasks</h2><div id="taskList"></div></div></section><section id="proofs" class="view" hidden><div class="card"><h2>Task proofs</h2><div id="proofList"></div></div></section><section id="users" class="view" hidden><div class="card"><h2>Users</h2><div id="userList"></div></div></section><section id="withdrawals" class="view" hidden><div class="card"><h2>Withdrawal requests</h2><div id="withdrawalList"></div></div></section><section id="deposits" class="view" hidden><div class="card"><h2>Deposit requests</h2><div id="depositList"></div></div></section><section id="settings" class="view" hidden><div class="card"><h2>Deposit configuration</h2><form id="settingsForm"><label><input id="depositEnabled" type="checkbox"> Enable deposits</label><label>Minimum deposit (৳)</label><input id="depositMin" type="number" min="1"><label><input id="bkashEnabled" type="checkbox"> Enable bKash</label><label>bKash number</label><input id="bkashNumber"><label><input id="nagadEnabled" type="checkbox"> Enable Nagad</label><label>Nagad number</label><input id="nagadNumber"><label><input id="binanceEnabled" type="checkbox"> Enable Binance</label><label>Binance account / Pay ID</label><input id="binanceAccount"><label>Instructions</label><textarea id="depositInstructions"></textarea><button class="primary">Save settings</button></form></div></section></section></main><script src="admin.js"></script></body></html>
