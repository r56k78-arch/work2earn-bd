<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Work2Earn BD — Admin Panel</title>
  <link rel="stylesheet" href="admin.css">
</head>

<body>

<main class="wrap">

  <!-- ADMIN LOGIN -->
  <section id="loginBox" class="card login">

    <div class="brand">Work2Earn BD</div>

    <p class="muted">Admin Panel</p>

    <input
      id="adminUser"
      placeholder="Admin username"
      autocomplete="username"
    >

    <input
      id="adminPass"
      type="password"
      placeholder="Admin password"
      autocomplete="current-password"
    >

    <button id="loginBtn">Login</button>

    <p id="loginMsg" class="msg"></p>

  </section>


  <!-- ADMIN DASHBOARD -->
  <section id="panel" hidden>

    <header class="topbar">

      <div>
        <strong>Work2Earn BD</strong>
        <span class="muted"> Admin Panel</span>
      </div>

      <button id="logoutBtn" class="secondary">
        Logout
      </button>

    </header>


    <div id="status" class="msg"></div>


    <!-- STATISTICS -->
    <section class="stats">

      <div class="stat">
        <span>Users</span>
        <b id="sUsers">0</b>
      </div>

      <div class="stat">
        <span>Tasks</span>
        <b id="sTasks">0</b>
      </div>

      <div class="stat">
        <span>Proofs</span>
        <b id="sProofs">0</b>
      </div>

      <div class="stat">
        <span>Withdrawals</span>
        <b id="sWithdrawals">0</b>
      </div>

    </section>


    <!-- CREATE TASK + TELEGRAM -->
    <section class="grid">

      <div class="card">

        <h2>Create Task</h2>

        <input
          id="taskTitle"
          placeholder="Task title"
        >

        <textarea
          id="taskDesc"
          placeholder="Task description"
        ></textarea>

        <input
          id="taskReward"
          type="number"
          min="0"
          step="0.01"
          placeholder="Reward (BDT)"
        >

        <button id="createTaskBtn">
          Create Task
        </button>

        <div id="taskMsg" class="msg"></div>

      </div>


      <div class="card">

        <h2>Telegram Settings</h2>

        <input
          id="tgSupport"
          placeholder="Telegram Support URL"
        >

        <input
          id="tgGroup"
          placeholder="Telegram Group URL"
        >

        <button id="saveTgBtn">
          Save Telegram Settings
        </button>

        <div id="tgMsg" class="msg"></div>

      </div>

    </section>


    <!-- TASKS -->
    <section class="card">

      <h2>Tasks</h2>

      <div id="tasks">
        Loading...
      </div>

    </section>


    <!-- USERS -->
    <section class="card">

      <h2>Recent Users</h2>

      <div id="users">
        Loading...
      </div>

    </section>


    <!-- PROOFS -->
    <section class="card">

      <h2>Pending Proofs</h2>

      <div id="proofs">
        Loading...
      </div>

    </section>


    <!-- WITHDRAWALS -->
    <section class="card">

      <h2>Pending Withdrawals</h2>

      <div id="withdrawals">
        Loading...
      </div>

    </section>

  </section>

</main>


<script src="admin.js"></script>

</body>
</html>
