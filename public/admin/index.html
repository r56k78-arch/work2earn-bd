<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work2Earn BD - Admin Panel</title>

  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <div class="box">
    <h1>Work2Earn BD</h1>
    <h2>Admin Panel</h2>

    <p>Admin Login</p>

    <input
      type="text"
      id="adminUsername"
      placeholder="Admin Username"
    >

    <input
      type="password"
      id="adminPassword"
      placeholder="Admin Password"
    >

    <button onclick="adminLogin()">Login</button>

    <div class="info">
      <p>Dashboard</p>
      <p>Users: 0</p>
      <p>Tasks: 0</p>
      <p>Pending Proofs: 0</p>
      <p>Pending Withdrawals: 0</p>
    </div>
  </div>

  <script src="admin.js"></script>

</body>
</html>
